{% load static %}

<!DOCTYPE html>

<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="AgroIA Moxico - Plataforma digital de apoio à agricultura, culturas, produtos agrícolas e diagnóstico assistido por inteligência artificial.">

  <meta name="author" content="AgroIA Moxico">
  <meta name="theme-color" content="#0d4d31">
  <meta name="color-scheme" content="light">

  <title>
    {% block title %}
    AgroIA Moxico
    {% endblock %}
  </title>

  <!-- =========================================================
     FONTES
========================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">

  <!-- =========================================================
     ESTILOS GLOBAIS
========================================================== -->
  <style>
    :root {
      --primary: #176b45;
      --primary-dark: #0d4d31;
      --primary-deep: #083a24;

      --primary-light: #eaf7ef;
      --primary-soft: #f3faf6;

      --secondary: #d9a441;
      --secondary-light: #f3dfae;

      --text: #173126;
      --text-light: #66776f;

      --background: #f6faf7;
      --white: #ffffff;

      --border: #e1ebe5;
      --border-hover: #c7ddd0;

      --danger: #b3452f;
      --danger-light: #fbeae5;

      --shadow:
        0 10px 30px rgba(23, 107, 69, 0.08);

      --shadow-hover:
        0 15px 35px rgba(23, 107, 69, 0.14);

      --radius: 18px;

      --nav-height: 68px;

      --transition: 0.25s ease;
    }


    /* =========================================================
       RESET
    ========================================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--nav-height) + 20px);
    }


    body {
      font-family: "DM Sans", sans-serif;

      color: var(--text);
      background: var(--background);

      line-height: 1.6;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow-x: hidden;

      padding-top: var(--nav-height);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    body.menu-open {
      overflow: hidden;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }


    button {
      border: 0;
    }


    img {
      display: block;
      max-width: 100%;
    }


    ul,
    ol {
      list-style: none;
    }


    ::selection {
      color: #ffffff;
      background: var(--primary);
    }


    /* =========================================================
       SCROLLBAR
    ========================================================== */

    ::-webkit-scrollbar {
      width: 9px;
    }

    ::-webkit-scrollbar-track {
      background: #eef5f0;
    }

    ::-webkit-scrollbar-thumb {
      background: #9bbdac;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }


    /* =========================================================
       CONTAINER
    ========================================================== */

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* =========================================================
       MAIN
    ========================================================== */

    main {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - var(--nav-height));
    }


    /* =========================================================
       PAGE HEADER
    ========================================================== */

    .page-header {
      padding: 75px 0 45px;

      background:
        radial-gradient(circle at 90% 20%,
          rgba(217, 164, 65, 0.12),
          transparent 28%),
        radial-gradient(circle at 5% 10%,
          rgba(37, 151, 101, 0.10),
          transparent 30%);
    }


    /* =========================================================
       EYEBROW
    ========================================================== */

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 13px;
      margin-bottom: 15px;

      border-radius: 100px;

      color: var(--primary);
      background: var(--primary-light);

      font-size: 0.82rem;
      font-weight: 700;
    }


    .eyebrow::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--secondary);
    }


    /* =========================================================
       TIPOGRAFIA
    ========================================================== */

    h1,
    h2,
    h3,
    h4 {
      font-family: "Manrope", sans-serif;
      line-height: 1.15;
    }


    /* =========================================================
       BOTÕES
    ========================================================== */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 13px 20px;

      border: none;
      border-radius: 11px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform var(--transition),
        background var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }


    .btn-primary {
      color: #ffffff;
      background: var(--primary);

      box-shadow:
        0 8px 20px rgba(23, 107, 69, 0.18);
    }


    .btn-primary:hover {
      background: var(--primary-dark);

      transform: translateY(-1px);

      box-shadow:
        0 12px 24px rgba(23, 107, 69, 0.22);
    }


    .btn-secondary {
      color: var(--primary);
      background: #ffffff;

      border: 1px solid var(--border);
    }


    .btn-secondary:hover {
      background: var(--primary-light);
      border-color: var(--border-hover);
    }


    /* =========================================================
       CARD
    ========================================================== */

    .card {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }


    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }


    /* =========================================================
       SECTION
    ========================================================== */

    .section {
      padding: 70px 0;
    }


    .section-header {
      max-width: 700px;
      margin-bottom: 35px;
    }


    .section-header h2 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.04em;
    }


    .section-header p {
      margin-top: 12px;

      color: var(--text-light);

      font-size: 1rem;
    }


    /* =========================================================
       NAVBAR
    ========================================================== */

    .navbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      height: var(--nav-height);

      display: flex;
      align-items: center;

      background: rgba(13, 77, 49, 0.94);

      color: #ffffff;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255, 255, 255, 0.10);

      box-shadow:
        0 8px 30px rgba(13, 77, 49, 0.18);

      transition:
        background 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;

      will-change: background, box-shadow;
    }


    .navbar.scrolled {
      background: rgba(8, 58, 36, 0.98);

      box-shadow:
        0 10px 35px rgba(8, 58, 36, 0.25);

      border-bottom-color:
        rgba(255, 255, 255, 0.12);
    }


    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      height: 100%;

      gap: 20px;
    }


    /* =========================================================
       BRAND
    ========================================================== */

    .brand {
      display: flex;
      align-items: center;

      gap: 8px;

      flex-shrink: 0;

      color: rgba(255, 255, 255, 0.96);

      font-family: "Manrope", sans-serif;

      font-size: 1.08rem;
      font-weight: 800;

      white-space: nowrap;
    }


    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 10px;

      color: var(--secondary);

      background:
        rgba(255, 255, 255, 0.10);

      border:
        1px solid rgba(255, 255, 255, 0.12);
    }


    .brand-icon svg {
      width: 17px;
      height: 17px;
    }


    .brand-name span {
      color: var(--secondary);
    }


    /* =========================================================
       MENU TOGGLE
    ========================================================== */

    .menu-toggle {
      display: none;

      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border:
        1px solid rgba(255, 255, 255, 0.16);

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.10);

      color: #ffffff;

      cursor: pointer;

      transition:
        background var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }


    .menu-toggle:hover {
      background:
        rgba(255, 255, 255, 0.18);

      border-color:
        rgba(255, 255, 255, 0.25);
    }


    .menu-toggle:active {
      transform: scale(0.96);
    }


    .menu-toggle svg {
      width: 21px;
      height: 21px;
    }


    /* =========================================================
       NAVEGAÇÃO
    ========================================================== */

    nav[aria-label="Navegação principal"] {
      display: flex;

      align-items: center;
      justify-content: flex-end;

      flex: 1;

      min-width: 0;
    }


    .nav-links {
      display: flex;

      align-items: center;

      gap: 4px;
    }


    .nav-link {
      display: flex;
      align-items: center;

      gap: 6px;

      min-height: 34px;

      padding: 7px 10px;

      border-radius: 9px;

      color:
        rgba(255, 255, 255, 0.78);

      font-size: 0.82rem;
      font-weight: 600;

      white-space: nowrap;

      transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition);
    }


    .nav-icon {
      width: 15px;
      height: 15px;

      flex-shrink: 0;
    }


    .nav-link svg {
      stroke-width: 1.9;
    }


    .nav-link:hover {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.12);
    }


    .nav-link.active {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.12);

      border:
        1px solid rgba(255, 255, 255, 0.12);
    }


    .nav-button.nav-link {
      margin-left: 3px;

      padding: 7px 11px;

      color: #173126;

      background: var(--secondary);

      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.14);
    }


    .nav-button.nav-link:hover {
      color: #173126;

      background: #e5b75c;

      transform: translateY(-1px);
    }


    /* =========================================================
       AUTENTICAÇÃO
    ========================================================== */

    .auth-area {
      display: flex;
      align-items: center;

      gap: 5px;

      margin-left: 4px;
    }


    .auth-register.nav-link {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.09);

      border:
        1px solid rgba(255, 255, 255, 0.12);
    }


    .auth-register.nav-link:hover {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.18);
    }


    .auth-login.nav-link {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.14);

      border:
        1px solid rgba(255, 255, 255, 0.14);

      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.14);
    }


    .auth-login.nav-link:hover {
      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.22);
    }


    /* =========================================================
       PERFIL
    ========================================================== */

    .user-profile {
      position: relative;

      margin-left: 6px;
    }


    .user-button {
      display: flex;
      align-items: center;

      gap: 9px;

      min-height: 34px;

      padding: 4px 10px 4px 4px;

      border:
        1px solid rgba(255, 255, 255, 0.14);

      border-radius: 100px;

      background:
        rgba(255, 255, 255, 0.09);

      color: #ffffff;

      cursor: pointer;

      transition:
        border-color var(--transition),
        background var(--transition);
    }


    .user-button:hover {
      background:
        rgba(255, 255, 255, 0.16);

      border-color:
        rgba(255, 255, 255, 0.25);
    }


    .user-avatar {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 29px;
      height: 29px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 50%;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.10);

      border:
        1px solid rgba(255, 255, 255, 0.12);
    }


    .user-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .user-avatar svg {
      width: 16px;
      height: 16px;
    }


    .user-name {
      max-width: 110px;

      overflow: hidden;

      color:
        rgba(255, 255, 255, 0.92);

      font-size: 0.85rem;
      font-weight: 700;

      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .user-chevron {
      width: 15px;
      height: 15px;

      flex-shrink: 0;

      color:
        rgba(255, 255, 255, 0.60);

      transition:
        transform 0.25s ease;
    }


    .user-profile.open .user-chevron {
      transform: rotate(180deg);
    }


    /* =========================================================
       DROPDOWN
    ========================================================== */

    .user-dropdown {
      position: absolute;

      top: calc(100% + 12px);
      right: 0;

      width: 240px;

      padding: 8px;

      background:
        rgba(255, 255, 255, 0.98);

      border:
        1px solid var(--border);

      border-radius: 16px;

      box-shadow: var(--shadow-hover);

      opacity: 0;
      visibility: hidden;

      transform: translateY(-8px);

      transition:
        opacity 0.22s ease,
        transform 0.22s ease,
        visibility 0.22s ease;
    }


    .user-profile.open .user-dropdown {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }


    .dropdown-user-info {
      padding: 10px 12px 12px;

      margin-bottom: 6px;

      border-bottom:
        1px solid var(--border);
    }


    .dropdown-user-name {
      display: block;

      color: var(--text);

      font-size: 0.9rem;
      font-weight: 800;
    }


    .dropdown-user-status {
      display: block;

      margin-top: 3px;

      color: var(--text-light);

      font-size: 0.72rem;
    }


    .dropdown-link {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px 12px;

      border-radius: 10px;

      color: var(--text);

      font-size: 0.85rem;
      font-weight: 600;

      transition:
        background var(--transition),
        color var(--transition);
    }


    .dropdown-link svg {
      width: 17px;
      height: 17px;

      flex-shrink: 0;

      color: var(--text-light);
    }


    .dropdown-link:hover {
      color: var(--primary);

      background: var(--primary-light);
    }


    .dropdown-link:hover svg {
      color: var(--primary);
    }


    .dropdown-divider {
      height: 1px;

      margin: 6px 4px;

      background: var(--border);
    }


    .dropdown-logout {
      color: var(--danger);
    }


    .dropdown-logout svg {
      color: var(--danger);
    }


    .dropdown-logout:hover {
      color: var(--danger);

      background: var(--danger-light);
    }


    /* =========================================================
       FOOTER
    ========================================================== */

    .footer {
      position: relative;

      margin-top: auto;

      overflow: hidden;

      color:
        rgba(255, 255, 255, 0.75);

      background:
        linear-gradient(135deg,
          #0d4d31 0%,
          #0b462c 38%,
          #083a24 70%,
          #062f1d 100%);

      border-top:
        1px solid rgba(217, 164, 65, 0.20);
    }


    .footer::before {
      content: "";

      position: absolute;

      width: 380px;
      height: 380px;

      top: -250px;
      right: -100px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(217, 164, 65, 0.13),
          transparent 68%);

      pointer-events: none;
    }


    .footer::after {
      content: "";

      position: absolute;

      width: 350px;
      height: 350px;

      bottom: -250px;
      left: -130px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(37, 151, 101, 0.12),
          transparent 68%);

      pointer-events: none;
    }


    .footer-main {
      position: relative;

      z-index: 1;

      display: grid;

      grid-template-columns:
        minmax(0, 1.5fr) minmax(150px, 0.8fr) minmax(170px, 0.85fr);

      gap: 34px;

      padding: 30px 0 24px;
    }


    .footer-column {
      display: flex;
      flex-direction: column;

      min-width: 0;
    }


    .footer-column h3 {
      margin-bottom: 11px;

      color: #ffffff;

      font-family: "Manrope", sans-serif;

      font-size: 0.75rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.075em;
    }


    .footer-column h3::after {
      content: "";

      display: block;

      width: 22px;
      height: 2px;

      margin-top: 6px;

      border-radius: 10px;

      background: var(--secondary);
    }


    .footer-link {
      display: flex;
      align-items: center;

      gap: 8px;

      width: fit-content;

      padding: 3px 0;

      color:
        rgba(255, 255, 255, 0.58);

      font-size: 0.75rem;

      line-height: 1.5;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .footer-link-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 16px;
      height: 16px;

      flex-shrink: 0;
    }


    .footer-link svg {
      width: 15px;
      height: 15px;

      color:
        rgba(255, 255, 255, 0.34);

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .footer-link:hover {
      color: var(--secondary);

      transform: translateX(3px);
    }


    .footer-link:hover svg {
      color: var(--secondary);

      transform: scale(1.05);
    }


    .footer-about {
      max-width: 390px;
    }


    .footer-about-text {
      max-width: 370px;

      color:
        rgba(255, 255, 255, 0.53);

      font-size: 0.74rem;

      line-height: 1.6;
    }


    .footer-about-text strong {
      color:
        rgba(255, 255, 255, 0.90);

      font-weight: 700;
    }


    .footer-about-list {
      display: flex;
      flex-direction: column;

      gap: 5px;

      margin-top: 10px;
    }


    .footer-about-item {
      display: flex;
      align-items: flex-start;

      gap: 7px;

      color:
        rgba(255, 255, 255, 0.53);

      font-size: 0.70rem;

      line-height: 1.45;
    }


    .footer-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 15px;
      height: 15px;

      flex-shrink: 0;

      margin-top: 1px;
    }


    .footer-about-item svg {
      width: 13px;
      height: 13px;

      color: var(--secondary);
    }


    .footer-bottom-wrapper {
      position: relative;

      z-index: 1;

      border-top:
        1px solid rgba(255, 255, 255, 0.07);
    }


    .footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      flex-wrap: wrap;

      padding: 10px 0;

      color:
        rgba(255, 255, 255, 0.38);

      font-size: 0.64rem;
    }


    .copyright {
      display: flex;
      align-items: center;

      gap: 5px;

      flex-wrap: wrap;
    }


    .copyright-dot {
      color:
        rgba(255, 255, 255, 0.25);
    }


    .footer-bottom-right {
      display: flex;
      align-items: center;

      gap: 5px;

      text-align: right;
    }


    .footer-bottom-right strong {
      color:
        rgba(255, 255, 255, 0.78);

      font-weight: 700;
    }


    .github-link {
      display: inline-flex;
      align-items: center;

      color:
        rgba(255, 255, 255, 0.78);

      font-weight: 700;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .github-link:hover {
      color: var(--secondary);

      transform: translateY(-1px);
    }


    /* =========================================================
       TABLET
    ========================================================== */

    @media (max-width: 1100px) {

      .nav-link {
        padding: 7px 8px;
        font-size: 0.78rem;
      }

      .nav-links {
        gap: 2px;
      }

      .user-name {
        max-width: 85px;
      }

      .footer-main {
        grid-template-columns:
          1.3fr 0.85fr 0.85fr;

        gap: 26px;
      }
    }


    /* =========================================================
       MOBILE NAVBAR
    ========================================================== */

    @media (max-width: 900px) {

      :root {
        --nav-height: 64px;
      }


      body {
        padding-top: var(--nav-height);
      }


      .container {
        width: calc(100% - 32px);
      }


      /* Navbar */

      .navbar {
        height: var(--nav-height);
      }


      .nav-container {
        width: 100%;

        padding-left: 16px;
        padding-right: 16px;

        gap: 12px;
      }


      /* Marca */

      .brand {
        min-width: 0;

        flex: 1;

        overflow: hidden;

        font-size: 1rem;
      }


      .brand-name {
        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
      }


      .brand-icon {
        width: 32px;
        height: 32px;

        border-radius: 9px;
      }


      /* Botão hamburger */

      .menu-toggle {
        display: flex;
      }


      /* Nav */

      nav[aria-label="Navegação principal"] {
        position: static;

        flex: 0 0 auto;

        width: auto;

        justify-content: flex-end;
      }


      /* =====================================================
           PAINEL MOBILE
        ====================================================== */

      .nav-links {
        position: fixed;

        top: var(--nav-height);
        left: 0;
        right: 0;

        z-index: 998;

        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 7px;

        width: 100%;

        max-height: calc(100dvh - var(--nav-height));

        padding: 16px;

        overflow-y: auto;
        overflow-x: hidden;

        background:
          linear-gradient(180deg,
            rgba(8, 58, 36, 0.99) 0%,
            rgba(7, 49, 31, 0.99) 100%);

        border-top:
          1px solid rgba(255, 255, 255, 0.10);

        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.25);

        opacity: 0;

        visibility: hidden;

        transform: translateY(-8px);

        pointer-events: none;

        transition:
          opacity 0.22s ease,
          transform 0.22s ease,
          visibility 0.22s ease;
      }


      .nav-links.open {
        opacity: 1;

        visibility: visible;

        transform: translateY(0);

        pointer-events: auto;
      }


      /* Links */

      .nav-links>.nav-link {
        display: flex;

        align-items: center;

        width: 100%;

        min-height: 48px;

        padding: 12px 14px;

        border-radius: 12px;

        color:
          rgba(255, 255, 255, 0.90);

        background:
          rgba(255, 255, 255, 0.065);

        border:
          1px solid rgba(255, 255, 255, 0.07);

        font-size: 0.91rem;

        white-space: normal;
      }


      .nav-links>.nav-link:hover,
      .nav-links>.nav-link.active {
        color: #ffffff;

        background:
          rgba(255, 255, 255, 0.13);

        border-color:
          rgba(255, 255, 255, 0.12);
      }


      .nav-links>.nav-link .nav-icon {
        width: 18px;
        height: 18px;
      }


      /* Botão principal */

      .nav-links>.nav-button.nav-link {
        justify-content: center;

        margin: 4px 0 0;

        min-height: 48px;

        color: #173126 !important;

        background:
          var(--secondary) !important;

        border-color:
          var(--secondary) !important;

        box-shadow:
          0 7px 18px rgba(0, 0, 0, 0.15);
      }


      /* =====================================================
           AUTENTICAÇÃO MOBILE
        ====================================================== */

      .auth-area {
        display: flex;

        flex-direction: column;

        align-items: stretch;

        width: 100%;

        gap: 7px;

        margin: 2px 0 0;

        padding-top: 8px;

        border-top:
          1px solid rgba(255, 255, 255, 0.10);
      }


      .auth-register.nav-link,
      .auth-login.nav-link {
        justify-content: center;

        width: 100%;

        min-height: 48px;

        text-align: center;
      }


      /* =====================================================
           PERFIL MOBILE
        ====================================================== */

      .user-profile {
        width: 100%;

        margin: 2px 0 0;

        padding-top: 8px;

        border-top:
          1px solid rgba(255, 255, 255, 0.10);
      }


      .user-button {
        width: 100%;

        min-height: 48px;

        justify-content: flex-start;

        padding: 6px 12px 6px 6px;

        border-radius: 12px;

        background:
          rgba(255, 255, 255, 0.065);
      }


      .user-name {
        max-width: none;

        flex: 1;

        text-align: left;

        font-size: 0.9rem;
      }


      .user-chevron {
        width: 18px;
        height: 18px;
      }


      /* Dropdown dentro do painel */

      .user-dropdown {
        position: static;

        width: 100%;

        margin-top: 7px;

        padding: 7px;

        background: #ffffff;

        border-radius: 12px;

        box-shadow: none;

        opacity: 1;

        visibility: visible;

        transform: none;

        display: none;
      }


      .user-profile.open .user-dropdown {
        display: block;
      }


      .dropdown-user-info {
        padding: 10px 11px;
      }


      .dropdown-link {
        min-height: 43px;

        padding: 10px 11px;
      }


      /* =====================================================
           FOOTER
        ====================================================== */

      .footer-main {
        grid-template-columns:
          1.4fr 1fr 1fr;

        gap: 24px;

        padding: 27px 0 22px;
      }


      .footer-about {
        max-width: 100%;
      }
    }


    /* =========================================================
       MOBILE PEQUENO
    ========================================================== */

    @media (max-width: 650px) {

      .container {
        width: calc(100% - 28px);
      }


      .section {
        padding: 55px 0;
      }


      .page-header {
        padding: 55px 0 35px;
      }


      .footer-main {
        grid-template-columns: 1fr;

        gap: 21px;

        padding: 25px 0 20px;
      }


      .footer-column {
        max-width: 100%;
      }


      .footer-about {
        max-width: 100%;
      }


      .footer-about-text {
        max-width: 100%;
      }


      .footer-bottom {
        align-items: flex-start;

        flex-direction: column;

        gap: 5px;

        padding: 10px 0;
      }


      .footer-bottom-right {
        align-items: flex-start;

        flex-wrap: wrap;

        text-align: left;
      }
    }


    /* =========================================================
       MOBILE MUITO PEQUENO
    ========================================================== */

    @media (max-width: 500px) {

      .nav-container {
        padding-left: 12px;
        padding-right: 12px;

        gap: 8px;
      }


      .brand {
        font-size: 0.94rem;

        gap: 7px;
      }


      .brand-icon {
        width: 31px;
        height: 31px;
      }


      .menu-toggle {
        width: 40px;
        height: 40px;
      }


      .nav-links {
        padding: 12px;

        gap: 6px;
      }


      .nav-links>.nav-link {
        min-height: 46px;

        padding: 11px 12px;

        font-size: 0.88rem;
      }


      .auth-area,
      .user-profile {
        margin-top: 1px;
      }


      .footer-about-text {
        font-size: 0.72rem;
      }


      .footer-about-item {
        font-size: 0.68rem;
      }


      .footer-link {
        font-size: 0.73rem;
      }


      .footer-bottom {
        font-size: 0.61rem;
      }
    }


    /* =========================================================
       ACESSIBILIDADE
    ========================================================== */

    .nav-link:focus-visible,
    .footer-link:focus-visible,
    .menu-toggle:focus-visible,
    .user-button:focus-visible,
    .dropdown-link:focus-visible,
    .github-link:focus-visible {
      outline:
        3px solid rgba(217, 164, 65, 0.65);

      outline-offset: 3px;
    }


    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }


      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>

  {% block extra_css %}
  {% endblock %}

</head>

<body id="topo">

  {% include "components/navbar.html" %}


  <main id="conteudo-principal">

    {% block content %}
    {% endblock %}

  </main>


  {% include "components/footer.html" %}


  <!-- =========================================================
     JAVASCRIPT GLOBAL
========================================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const menuToggle =
        document.getElementById("menuToggle");

      const navLinks =
        document.getElementById("navLinks");

      const menuIcon =
        document.getElementById("menuIcon");

      const userProfile =
        document.getElementById("userProfile");

      const userButton =
        document.getElementById("userButton");

      const navbar =
        document.querySelector(".navbar");


      /* =====================================================
         ÍCONE DO MENU
      ====================================================== */

      function setMenuIcon(opened) {

        if (!menuIcon) {
          return;
        }


        if (opened) {

          menuIcon.innerHTML = `
                    <line x1="5" y1="5" x2="19" y2="19"></line>
                    <line x1="19" y1="5" x2="5" y2="19"></line>
                `;

        } else {

          menuIcon.innerHTML = `
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                `;
        }
      }


      /* =====================================================
         FECHAR DROPDOWN
      ====================================================== */

      function closeUserDropdown() {

        if (!userProfile) {
          return;
        }


        userProfile.classList.remove("open");


        if (userButton) {

          userButton.setAttribute(
            "aria-expanded",
            "false"
          );
        }
      }


      /* =====================================================
         ABRIR / FECHAR DROPDOWN
      ====================================================== */

      function toggleUserDropdown() {

        if (!userProfile || !userButton) {
          return;
        }


        const opened =
          !userProfile.classList.contains("open");


        userProfile.classList.toggle(
          "open",
          opened
        );


        userButton.setAttribute(
          "aria-expanded",
          String(opened)
        );
      }


      /* =====================================================
         FECHAR MENU MOBILE
      ====================================================== */

      function closeMobileMenu() {

        if (navLinks) {

          navLinks.classList.remove("open");
        }


        if (menuToggle) {

          menuToggle.setAttribute(
            "aria-expanded",
            "false"
          );

          menuToggle.setAttribute(
            "aria-label",
            "Abrir menu"
          );
        }


        setMenuIcon(false);


        document.body.classList.remove(
          "menu-open"
        );
      }


      /* =====================================================
         ABRIR / FECHAR MENU MOBILE
      ====================================================== */

      function toggleMobileMenu() {

        if (!navLinks || !menuToggle) {
          return;
        }


        const opened =
          !navLinks.classList.contains("open");


        navLinks.classList.toggle(
          "open",
          opened
        );


        menuToggle.setAttribute(
          "aria-expanded",
          String(opened)
        );


        menuToggle.setAttribute(
          "aria-label",
          opened
            ? "Fechar menu"
            : "Abrir menu"
        );


        setMenuIcon(opened);


        document.body.classList.toggle(
          "menu-open",
          opened
        );


        if (opened) {

          closeUserDropdown();
        }
      }


      /* =====================================================
         BOTÃO DO MENU
      ====================================================== */

      if (menuToggle) {

        menuToggle.addEventListener(
          "click",
          function (event) {

            event.preventDefault();

            event.stopPropagation();

            toggleMobileMenu();
          }
        );
      }


      /* =====================================================
         BOTÃO DO UTILIZADOR
      ====================================================== */

      if (userButton) {

        userButton.addEventListener(
          "click",
          function (event) {

            event.preventDefault();

            event.stopPropagation();

            toggleUserDropdown();
          }
        );
      }


      /* =====================================================
         LINKS DA NAVBAR
      ====================================================== */

      document
        .querySelectorAll(".nav-links a")
        .forEach(function (link) {

          link.addEventListener(
            "click",
            function () {

              closeMobileMenu();

              closeUserDropdown();
            }
          );
        });


      /* =====================================================
         LINK ATIVO
      ====================================================== */

      const currentPath =
        window.location.pathname;


      document
        .querySelectorAll(".nav-link")
        .forEach(function (link) {

          const href =
            link.getAttribute("href");


          if (!href || href === "#") {
            return;
          }


          let linkPath;


          try {

            linkPath =
              new URL(
                href,
                window.location.origin
              ).pathname;

          } catch (error) {

            return;
          }


          if (
            linkPath === "/" &&
            currentPath === "/"
          ) {

            link.classList.add("active");

            return;
          }


          if (
            linkPath !== "/" &&
            currentPath.startsWith(linkPath)
          ) {

            link.classList.add("active");
          }
        });


      /* =====================================================
         NAVBAR AO FAZER SCROLL
      ====================================================== */

      function updateNavbar() {

        if (!navbar) {
          return;
        }


        if (window.scrollY > 20) {

          navbar.classList.add("scrolled");

        } else {

          navbar.classList.remove("scrolled");
        }
      }


      if (navbar) {

        updateNavbar();


        window.addEventListener(
          "scroll",
          updateNavbar,
          {
            passive: true
          }
        );
      }


      /* =====================================================
         CLIQUE FORA
      ====================================================== */

      document.addEventListener(
        "click",
        function (event) {

          if (
            navLinks &&
            menuToggle
          ) {

            const insideMenu =
              navLinks.contains(event.target);

            const insideToggle =
              menuToggle.contains(event.target);


            if (
              !insideMenu &&
              !insideToggle
            ) {

              closeMobileMenu();
            }
          }


          if (
            userProfile &&
            !userProfile.contains(event.target)
          ) {

            closeUserDropdown();
          }
        }
      );


      /* =====================================================
         ESC
      ====================================================== */

      document.addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Escape") {

            closeMobileMenu();

            closeUserDropdown();


            if (menuToggle) {

              menuToggle.focus();
            }
          }
        }
      );


      /* =====================================================
         ÂNCORAS
      ====================================================== */

      document
        .querySelectorAll('a[href*="#"]')
        .forEach(function (link) {

          link.addEventListener(
            "click",
            function (event) {

              const href =
                link.getAttribute("href");


              if (
                !href ||
                !href.includes("#")
              ) {
                return;
              }


              const hash =
                href.substring(
                  href.indexOf("#")
                );


              if (
                !hash ||
                hash === "#"
              ) {
                return;
              }


              try {

                const target =
                  document.querySelector(hash);


                if (target) {

                  event.preventDefault();


                  closeMobileMenu();

                  closeUserDropdown();


                  const navbarHeight =
                    navbar
                      ? navbar.offsetHeight
                      : 0;


                  const targetPosition =
                    target.getBoundingClientRect().top +
                    window.scrollY -
                    navbarHeight -
                    15;


                  window.scrollTo({
                    top: targetPosition,
                    behavior: "smooth"
                  });
                }

              } catch (error) {

                // Ignorar âncoras inválidas.
              }
            }
          );
        });


      /* =====================================================
         RESIZE
      ====================================================== */

      let previousWidth =
        window.innerWidth;


      window.addEventListener(
        "resize",
        function () {

          const currentWidth =
            window.innerWidth;


          /*
           * Se sair do modo mobile,
           * limpamos completamente o estado
           * do menu.
           */

          if (
            previousWidth <= 900 &&
            currentWidth > 900
          ) {

            closeMobileMenu();

            closeUserDropdown();
          }


          previousWidth =
            currentWidth;
        }
      );


      /* =====================================================
         ESTADO INICIAL
      ====================================================== */

      setMenuIcon(false);


      if (menuToggle) {

        menuToggle.setAttribute(
          "aria-expanded",
          "false"
        );

        menuToggle.setAttribute(
          "aria-label",
          "Abrir menu"
        );
      }


      if (userButton) {

        userButton.setAttribute(
          "aria-expanded",
          "false"
        );
      }

    });

  </script>


  {% block extra_js %}
  {% endblock %}

</body>

</html>
